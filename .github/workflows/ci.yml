name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore PyroLens.sln

      - name: Build
        run: dotnet build PyroLens.sln --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/PyroLens.UnitTests --no-build -c Release --logger "trx;LogFileName=unit.trx"

      # Testcontainers starts postgis/postgis on the runner's Docker engine.
      - name: Integration tests (PostGIS)
        run: dotnet test tests/PyroLens.IntegrationTests --no-build -c Release --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Builds both images on every run; pushes them to GitHub Container Registry on main.
  docker-images:
    runs-on: ubuntu-latest
    needs: [build-and-test, web]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - { name: pyrolens-api, dockerfile: src/PyroLens.Api/Dockerfile }
          - { name: pyrolens-worker, dockerfile: src/PyroLens.Worker/Dockerfile }
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/nikolhs123/${{ matrix.image.name }}:latest
            ghcr.io/nikolhs123/${{ matrix.image.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Nikolhs123/PyroLens
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
